name: Basic research validation

on:
  push:
  pull_request:

jobs:
  python-syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check V6 submission syntax
        run: python -m py_compile submission/market_maker_v6.py

  latex-report:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra

      - name: Compile technical report
        working-directory: docs/report
        run: |
          latexmk \
            -pdf \
            -interaction=nonstopmode \
            -halt-on-error \
            main.tex